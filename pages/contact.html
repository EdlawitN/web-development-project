
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Explore Ethiopia</title>
</head>
<body>

    <header>
        <h1>Contact Us</h1>
<nav>
    <a href="../index.html">Home</a> |
    <a href="destinations.html">Destinations</a> |
    <a href="tourguide.html">Tour Guides</a> |
    <a href="tourpackage.html">Tour Packages</a> |
    <a href="contact.html">Contact</a>
</nav>
    </header>

    <main>

        <section>
            <h2>Get in Touch</h2>

            <p>
                Do you want to learn more about Ethiopia?
                Contact us using the form below.
            </p>

            <form>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <label for="message">Your Message:</label>
                <textarea id="message" name="message" required></textarea>

                <br><br>

                <input type="submit" value="Send Message">
            </form>
        </section>

        <section>
            <h2>Email Us</h2>
            <p>
                <a href="mailto:info@exploreethiopia.com">
                    Send us an email
                </a>
            </p>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Discover Ethiopia. All rights reserved.</p>
    </footer>

</body>
</html>
